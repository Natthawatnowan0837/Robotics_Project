; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_microros_transport = serial
board_microros_distro = humble
lib_deps = 
	https://github.com/micro-ROS/micro_ros_platformio
	mirs240x/micro_ros_arduino@^2.0.7-humble
	arkhipenko/TaskScheduler@^4.0.3
	rfetick/MPU6050_light@^1.1.0
	robtillaart/AS5600@^0.6.6
	robtillaart/MS5611@^0.5.1
	br3ttb/PID@^1.2.1
	robtillaart/PID_RT@^0.1.9
	dlloydev/QuickPID@^3.1.9
build_flags = 
	-L ./.pio/libdeps/esp32dev/micro_ros_arduino/src/esp32/
	-l microros
	-D ESP32
	-D RCUTILS_LOGGING_ENABLED=1
