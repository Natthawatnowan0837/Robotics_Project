### ekf.yaml ###
ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.1
    two_d_mode: true        # หุ่นยนต์วิ่งบนพื้นราบ
    publish_tf: true        # ให้ EKF เป็นคนสร้าง TF odom -> base_link
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # 1. ข้อมูลจาก RTAB-Map (Visual Odometry)
    odom0: /odom            # หรือชื่อ topic odom จากกล้องคุณ
    odom0_config: [true,  true,  false, # x, y, z
                   false, false, true,  # roll, pitch, yaw (เอาค่าหันหน้าจากกล้อง)
                   false, false, false, 
                   false, false, false,
                   false, false, false]

    # 2. ข้อมูลจาก MPU6050 (ผ่าน Bridge ที่เราเพิ่งทำ)
    imu0: /imu/data
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  true,  true,  true,  # vroll, vpitch, vyaw (Gyro สำคัญมาก!)
                  true,  true,  true]  # ax, ay, az (Accel ช่วยตอนเริ่มขยับ)
    imu0_differential: false
    imu0_relative: true     # ให้เริ่มนับมุมจาก 0 ตอนเปิดหุ่น