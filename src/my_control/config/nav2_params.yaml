controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.1
      
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      
      # ==========================================================
      # [กลุ่มที่ 1: ตั้งค่าความเร็วและความเร่ง] - แก้ตรงนี้เพื่อเพิ่มความเร็ว
      # ==========================================================
      max_vel_x: 0.15        # ความเร็วเดินหน้าสูงสุด (m/s)
      max_speed_xy: 0.15      # ต้องเท่ากับ max_vel_x
      max_vel_theta: 0.1 # ความเร็วการหมุนสูงสุด (rad/s)
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_y: 0.0
      min_speed_xy: 0.0
      min_speed_theta: 0.1

      acc_lim_x: 3.0          # ความเร่งเดินหน้า (ยิ่งมากยิ่งออกตัวแรง)
      acc_lim_theta: 3.5      # ความเร่งการหมุน
      decel_lim_x: -3.0       # ความเร็วในการเบรก (ต้องสัมพันธ์กับความเร็ว)
      decel_lim_theta: -3.5
      # ==========================================================

      # ==========================================================
      # [กลุ่มที่ 2: การทำนายเส้นทางและการตัดสินใจ]
      # ==========================================================
      sim_time: 2.0      # เวลาที่หุ่นยนต์คำนวณล่วงหน้า (วินาที)
      vx_samples: 20          # จำนวนการสุ่มความเร็ว x เพื่อหาค่าที่ดีที่สุด
      vtheta_samples: 20      # จำนวนการสุ่มความเร็วการหมุน
      vy_samples: 5
      
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.15
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: True
      stateful: True
      # ==========================================================

      # [ค่าน้ำหนักการคำนวณ (Critics)]
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.05
      PathAlign.scale: 8.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 8.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 24.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 24.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      footprint: "[[-0.65, -0.55], [-0.65, 0.55], [0.65, 0.55], [0.65, -0.55]]"
      use_sim_time: False
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        inflation_radius: 0.3
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: rtabmap_obstacles
        rtabmap_obstacles:
          topic: /rtabmap/octomap_obstacles
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "PointCloud2"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      footprint: "[[-0.65, -0.55], [-0.65, 0.55], [0.65, 0.55], [0.65, -0.55]]"
      map_topic: /rtabmap/map
      use_sim_time: False
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: rtabmap_obstacles
        rtabmap_obstacles:
          topic: /rtabmap/octomap_obstacles
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "PointCloud2"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        inflation_radius: 0.3

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: False
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: true
      allow_unknown: true

velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.15, 0.0, 0.1]
    min_velocity: [-0.15, 0.0, -0.1]
    max_accel: [3.0, 0.0, 3.5]
    max_decel: [-3.0, 0.0, -3.5]
    odom_topic: "odom"
    velocity_timeout: 1.0