ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.1
    two_d_mode: true        # บังคับให้คำนวณเฉพาะในระนาบ 2D (X, Y, Yaw)
    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # 1. ข้อมูลจาก Encoder (Wheel Odometry)
    odom0: /odom
    odom0_config: [true,  true,  false, # x, y, z
                   false, false, false, # roll, pitch, yaw
                   true,  false, false, # vx, vy, vz
                   false, false, false, # vroll, vpitch, vyaw 
                   false, false, false]
    odom0_queue_size: 10
    odom0_relative: false
    odom0_differential: false

    # 2. ข้อมูลจาก MPU6050 (IMU)
    imu0: /imu/data_standard
    # แก้ไข imu0_config: เน้นรับค่า Orientation และ Angular Velocity
    imu0_config: [false, false, false, # x, y, z
                  false, false, true,  # roll, pitch, yaw (เอาเฉพาะ Yaw)
                  false, false, false, # vx, vy, vz
                  false, false, true,  # vroll, vpitch, vyaw (เอาเฉพาะ angular velocity แกน Z)
                  false, false, false] # ax, ay, az
    imu0_queue_size: 10
    
    # การตั้งค่าแนะนำเพิ่มเติมสำหรับ IMU
    imu0_relative: true                # เริ่มนับมุม 0 ใหม่เมื่อ Reset หุ่น (ช่วยลดปัญหามุมกระโดดตอนเริ่ม)
    imu0_differential: false           # ใช้ค่า Absolute Orientation จาก Filter ภายใน IMU
    imu0_remove_gravitational_acceleration: true