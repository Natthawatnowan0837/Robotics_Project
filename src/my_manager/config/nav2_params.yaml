controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.3
      # ปรับจาก 3.14 เป็นค่าที่น้อยลง เช่น 0.1 หรือ 0.15 เรเดียน (ประมาณ 5-8 องศา)
      yaw_goal_tolerance: 0.7
      
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      
      max_vel_x: 0.3          # ความเร็วสูงสุดที่เราต้องการ
      max_speed_xy: 0.3
      max_vel_theta: 0.3       # ลดลงมานิดนึงจาก 1.0 เพื่อให้ภาพไม่เบลอตอน Re-localize
      min_vel_x: 0.0
      min_speed_xy: 0.0
      min_speed_theta: 0.0   
      
      # ความเร่งใน DWB ควรจะ "น้อยกว่า" หรือ "เท่ากับ" Smoother
      acc_lim_x: 0.5           # ออกตัวนิ่มๆ (ลดจาก 1.0)
      acc_lim_theta: 1.5      
      decel_lim_x: -1.0        # เบรกให้ไวกว่าตอนออกตัวนิดนึง
      decel_lim_theta: -2.0
          #=================================

      # ==========================================================
      # [กลุ่มที่ 2: การทำนายเส้นทางและการตัดสินใจ]
      # ==========================================================
      sim_time: 3.0      # เวลาที่หุ่นยนต์คำนวณล่วงหน้า (วินาที)
      vx_samples: 20          # จำนวนการสุ่มความเร็ว x เพื่อหาค่าที่ดีที่สุด
      vtheta_samples: 20      # จำนวนการสุ่มความเร็วการหมุน
      vy_samples: 5
      
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.15
      trans_stopped_velocity: 0.05
      short_circuit_trajectory_evaluation: True
      stateful: True
      # ==========================================================

      # [ค่าน้ำหนักการคำนวณ (Critics)]
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 1.0 #ตรวจเช็กว่าเส้นทางนั้นจะชนสิ่งกีดขวางใน Costmap
      PathAlign.scale: 2.0 #ยิ่งค่า scale สูง หุ่นจะยิ่งพยายามบิดตัวให้หน้าตรงกับทางที่จะไป
      PathAlign.forward_point_distance: 0.25
      GoalAlign.scale: 0.0 # สั่งให้หุ่นหันหน้าเข้าหาจุดเป้าหมาย (Goal) ตลอดเวลา
      GoalAlign.forward_point_distance: 0.25
      PathDist.scale: 5.0 #สั่งให้หุ่นยนต์ "เกาะเส้นพาธ"
      GoalDist.scale: 10.0 #สั่งให้หุ่นยนต์พยายามลดระยะห่างจากจุดหมายให้เร็วที่สุด
      RotateToGoal.scale: 10.0 #บังคับให้หุ่นหมุนตัวอยู่กับที่เพื่อให้หน้าตรงกับ Goal เมื่อถึงระยะหนึ่ง
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      footprint: "[[-0.55, -0.5], [-0.55, 0.5], [0.55, 0.5], [0.55, -0.5]]"
      use_sim_time: False
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.0  # ลดค่าลง (ยิ่งน้อย ยิ่งกลัว)
        inflation_radius: 0.25     # เพิ่มรัศมี (ยิ่งมาก ยิ่งเว้นระยะห่าง)
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: rtabmap_obstacles
        rtabmap_obstacles:
          topic: /rtabmap/octomap_obstacles
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "PointCloud2"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      footprint: "[[-0.35, -0.3], [-0.35, 0.3], [0.35, 0.3], [0.35, -0.3]]"
      map_topic: /rtabmap/map
      use_sim_time: False
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: rtabmap_obstacles
        rtabmap_obstacles:
          topic: /rtabmap/octomap_obstacles
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "PointCloud2"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.0
        inflation_radius: 0.25

planner_server:
  ros__parameters:
    expected_planner_frequency: 5.0
    use_sim_time: False
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: true
      allow_unknown: true

velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.3, 0.0, 0.3] 
    min_velocity: [-0.3, 0.0, -0.3] # ยอมให้ถอยหลังได้เท่ากับเดินหน้า
    
    # ค่าความเร่งที่ยอมให้เกิดขึ้น (ควรมาก5ว่า DWB ประมาณ 20-50%)
    # เพื่อให้ Smoother ไม่ไปหน่วงการตัดสิน5จของ Planner จนเกินไป
    max_accel: [0.8, 0.0, 2.0]
    max_decel: [-1.5, 0.0, -2.5]
    odom_topic: "odom"
    velocity_timeout: 1.0